<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Styles/main.css">
    <script type="module" src="Scripts/main.js"></script>
    <title>Calculadora de Cuota Mensual</title>
</head>
<body>
    <head>
        <h1>Calcula tu cuota mensual, facil y rapido</h1>
    </head>
    <form id="generarCuota">
        <main>
            <section class="laInfo">
                <div>
                    <table>
                        <caption>Datos del credito</caption>  
                        <tr>
                            <td>Nombre</td>
                            <td>
                                <input type="text" value="" id="elNombre" class="inputs">
                            </td>
                        </tr>  
                        <tr>
                            <td>Numero de meses</td>
                            <td>
                                <input type="number" value="" id="Meses" class="inputs">
                            </td>
                        </tr>                     
                        <tr>
                            <td>Interes</td>
                            <td>
                                <input type="text" value="" id="Interes" class="inputs">
                            </td>
                        </tr>
                        <tr>
                            <td>Prestamo</td>
                            <td>
                                <input type="number" value="" id="Prestamo" class="inputs">
                            </td>
                        </tr>                           
                    </table>
                </div>
                <div>
                    <textarea id="laRespuesta" readonly></textarea>
                </div>
                <div>
                    <table id="botones">
                        <td>
                            <button id="calcular" type="submit">Calcular credito</button>
                        </td>
                    </table>
                </div>
            </section>
            <hr>
        </main>
    </form>    
</body>
</html>
